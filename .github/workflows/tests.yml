# The full test suite on GitHub's machines, on every push and pull request, and by hand
# (Actions tab -> tests -> Run workflow).
#
# Two Python versions: 3.9 (what the WashU cluster has) and 3.13 (what the code was written on).
# GitHub has no Python 3.9 for Ubuntu 26.04 (ubuntu-latest from November 2026), so 3.9 runs on
# ubuntu-24.04; when GitHub retires that image, move 3.9 to a container or drop it.
# torch comes from PyTorch's CPU-only index, so no CUDA libraries are downloaded.
# The run ends with the results headline that conftest.py prints (scripts/report.py; it reads
# results/ledger.csv and runs no simulation); the same headline goes to the job summary.
# The suite takes 2 minutes on a recent laptop, about 21 on an old cluster node and about 29 here
# (one process; first run 2026-11-18), hence the 60-minute limit.

name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.9"
            os: ubuntu-24.04
          - python: "3.13"
            os: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install requirements (torch CPU-only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-dev.txt
          python -m pip list

      - name: Run the tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee "$RUNNER_TEMP/pytest.log"

      - name: Results headline to the job summary
        if: always()
        env:
          PY: ${{ matrix.python }}
        run: |
          log="$RUNNER_TEMP/pytest.log"
          {
            echo "### Tests, Python $PY"
            echo
            if [ -f "$log" ]; then
              echo '```'
              # from the headline separator printed by conftest.py to the end (the pass/fail count)
              awk '/results headline/{p=1} p' "$log" | sed 's/\x1b\[[0-9;]*m//g'
              # no headline (pytest stopped early): the last lines of the log instead
              grep -q 'results headline' "$log" || tail -n 30 "$log"
              echo '```'
            else
              echo "No test log (the run did not start)."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
